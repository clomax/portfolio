<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <!-- Thumbnail for Starchitect: the knotted star logo on the hero gradient of the
       Starchitect site, with that site's colours for light and dark mode -->
  <style>
    svg { --hero-from: #8a006d; --hero-to: #2f0049; --hero-text: #ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { --hero-from: #5c0049; --hero-to: #1e0030; --hero-text: #f8f0f6; }
    }
    .from { stop-color: var(--hero-from); }
    .to { stop-color: var(--hero-to); }
    .star { fill: var(--hero-text); }
  </style>
  <defs>
    <!-- The same direction as the site's linear-gradient(160deg, ...) -->
    <linearGradient id="hero" gradientUnits="userSpaceOnUse" x1="327.5" y1="-119" x2="632.5" y2="719">
      <stop class="from" offset="0"/>
      <stop class="to" offset="1"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#hero)"/>
