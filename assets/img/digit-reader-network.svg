  <rect class="d-bar" x="726" y="413" width="15" height="14" rx="2"/>
  <text class="d-small d-muted" x="749" y="424">0.09</text>

  <!-- Sizes -->
  <text class="d-small d-muted" x="124" y="460" text-anchor="middle">28 × 28 pixels</text>
  <text class="d-small d-muted" x="330" y="460" text-anchor="middle">784 units</text>
  <text class="d-small d-muted" x="510" y="460" text-anchor="middle">60 units</text>
  <text class="d-small d-muted" x="700" y="460" text-anchor="middle">10 units, one per digit</text>
