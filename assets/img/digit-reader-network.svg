  <text class="d-small d-muted" x="741" y="144">0.04</text>
  <circle class="d-node" cx="700" cy="180" r="14"/>
  <text class="d-head" x="700" y="185" text-anchor="middle">3</text>
  <rect class="d-bar" x="726" y="173" width="3" height="14" rx="1.5"/>
  <text class="d-small d-muted" x="737" y="184">0.02</text>
  <circle class="d-node" cx="700" cy="220" r="14"/>
  <text class="d-head" x="700" y="225" text-anchor="middle">4</text>
  <rect class="d-bar" x="726" y="213" width="8" height="14" rx="2"/>
  <text class="d-small d-muted" x="742" y="224">0.05</text>
  <circle class="d-node" cx="700" cy="260" r="14"/>
  <text class="d-head" x="700" y="265" text-anchor="middle">5</text>
  <rect class="d-bar" x="726" y="253" width="2" height="14" rx="1"/>
  <text class="d-small d-muted" x="736" y="264">0.01</text>
  <circle class="d-node" cx="700" cy="300" r="14"/>
  <text class="d-head" x="700" y="305" text-anchor="middle">6</text>
  <rect class="d-bar" x="726" y="293" width="2" height="14" rx="1"/>
  <text class="d-small d-muted" x="736" y="304">0.00</text>
  <circle class="d-node d-node-top" cx="700" cy="340" r="14"/>
  <text class="d-head d-on-accent" x="700" y="345" text-anchor="middle">7</text>
  <rect class="d-bar-top" x="726" y="333" width="158" height="14" rx="2"/>
  <text class="d-small d-head" x="892" y="344">0.93</text>
  <circle class="d-node" cx="700" cy="380" r="14"/>
  <text class="d-head" x="700" y="385" text-anchor="middle">8</text>
